# Delivery checks: scope.

- id: SCOPE-01
  title: Scope written only as "in"
  kind: delivery
  concern: scope
  question: >-
    Is there a written list of what is out of scope, as well as what is in? When someone says "I assumed
    that was included", which document will we point to?
  why: >-
    The scope listed the tables to build. The business assumed the reports on top were included too, and
    the argument cost a month and the sponsor's trust.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: business-analyst
  also: [project-manager, technical-anchor, business-owner]
  evidence:
    docs: [discovery, requirements]
    looks_like: >-
      Three lists, in scope, out of scope and later, each item specific enough that a stranger could say
      which list a new request belongs to.
  signals:
    - No "out of scope" heading or list in the discovery, scope or requirements document.
    - The out-of-scope list is generic ("anything not listed above").
  contradiction: >-
    Compare the scope with the requirements: a requirement that is neither in the in-scope list nor
    explicitly out is a future argument.
  due: {plan: 3, designed: 4}
  fail_fast: >-
    Ask the business owner to read only the out-of-scope list and say which item surprises them.
  severity: high
  related: [SCOPE-02, SCOPE-06]
  signal_id: no-out-of-scope

- id: SCOPE-02
  title: The data scope traps left silent
  kind: delivery
  concern: scope
  question: >-
    Has each of the ten data scope traps been written down as in, out or later: history and backfill,
    deletes at the source, late and corrected data, changes over time, bad rows, source data quality,
    personal data, reports and dashboards, access and onboarding, and recovery? Which of them will someone
    assume was included?
  why: >-
    Nobody wrote down whether deleted customers should disappear from the reports. The business assumed
    yes, the team assumed no, and the gap was found by an auditor.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: technical-anchor
  also: [business-analyst, business-owner]
  evidence:
    docs: [discovery, requirements]
    looks_like: >-
      A table with one row per trap, the decision (in, out or later), who decided and why.
  signals:
    - Several of the words history, backfill, delete, late, correction, bad rows, quality, personal data,
      reports, access and recovery do not appear in the scope section.
    - Traps are mentioned but marked "to be confirmed" after discovery sign-off.
  contradiction: >-
    Compare the scope with the architecture: a trap the architecture handles (for example history kept)
    that the scope does not mention, or the reverse, shows the two were never reconciled.
  due: {plan: 3, designed: 4}
  fail_fast: >-
    Walk the ten traps with the business owner in thirty minutes and record each answer.
  severity: high
  related: [SCOPE-01, EST-07]
  signal_id: null

- id: SCOPE-03
  title: Scope creep with no change process
  kind: delivery
  concern: scope
  question: >-
    Is there an agreed way to handle a new request: who can raise it, how it is sized, who decides, and how
    the plan and estimate change? If the project ends late, how much of the lateness will be work that was
    added without anyone deciding to add it?
  why: >-
    Each request was small and agreed in a meeting. After three months, a fifth of the work had never been
    estimated, the date had not moved, and the team was blamed for the slip.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: project-manager
  also: [business-owner, technical-anchor]
  evidence:
    docs: [plan, decisions]
    looks_like: >-
      A written change process and a change log where each change shows the request, its size, its effect
      on date and cost, the decision and who made it.
  signals:
    - No "change control", "change request" or "change process" in the plan.
    - Status reports mention new items that do not appear in the original scope or in any change log.
    - Meeting notes include "can we also add" with no follow-up decision.
  contradiction: >-
    Compare the latest status report or backlog with the signed scope: items in the backlog that are not in
    the scope and have no change record are unmanaged creep.
  due: {plan: 4, evidenced: 6}
  fail_fast: >-
    Count backlog items added since sign-off and check how many have a recorded decision.
  severity: high
  related: [SCOPE-04, PM-03]
  signal_id: null

- id: SCOPE-04
  title: '"Phase 2" used as a hiding place'
  kind: delivery
  concern: scope
  question: >-
    Is everything labelled "phase 2" or "later" actually planned, funded and owned, and does the business
    know that phase 2 may never happen? If phase 2 is cancelled, will the first phase still be useful on its own?
  why: >-
    Hard items such as history and data quality were moved to phase 2 to make the first phase look
    affordable. Phase 2 was never funded, and phase 1 was unusable without them.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: project-manager
  also: [business-owner, business-analyst]
  evidence:
    docs: [plan, discovery]
    looks_like: >-
      A "later" list in which each item states whether phase 1 depends on it, an owner, and whether funding
      exists, plus a statement that phase 1 is usable without them.
  signals:
    - Many items marked "phase 2", "future phase" or "later" with no dates or owners.
    - Phase 2 has no estimate or budget.
    - Items that the main goal depends on are listed under phase 2.
  contradiction: >-
    Compare the goals or success measures with the phase-2 list: a goal that can only be met by phase-2
    items means phase 1 alone does not deliver the value promised.
  due: {plan: 3, designed: 4}
  fail_fast: >-
    Ask the sponsor: "If there is no phase 2, would you still pay for phase 1 as written?"
  severity: medium
  related: [SCOPE-05, REQ-07]
  signal_id: null

- id: SCOPE-05
  title: MVP 1 is too big
  kind: delivery
  concern: scope
  question: >-
    Is the first MVP the smallest slice that gives real value and proves the hardest parts work end to end?
    If the first release slips by months, will it be because it tried to do everything at once?
  why: >-
    MVP 1 contained eight sources and every report. Nothing reached production for nine months, so no
    real feedback arrived until it was too late to change direction.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: project-manager
  also: [technical-anchor, business-owner]
  evidence:
    docs: [plan]
    looks_like: >-
      An MVP 1 that can reach production within a few months, chosen for value and for testing the riskiest
      beliefs, with later MVPs listed in order of dependency and value.
  signals:
    - MVP 1 contains most or all of the in-scope items.
    - The first production release date is more than about three months after build starts.
    - The reason for the MVP order is not written down.
  contradiction: >-
    Compare the plan's MVP 1 with the estimate: if MVP 1 holds most of the estimated effort, it is the
    whole project with a different label.
  due: {plan: 3, designed: 4}
  fail_fast: >-
    Ask what could be removed from MVP 1 while it still gives one group of users a real answer.
  severity: medium
  related: [SCOPE-04, PM-05]
  signal_id: null

- id: SCOPE-06
  title: Scope not signed by the business owner
  kind: delivery
  concern: scope
  question: >-
    Has the person who will judge success signed the in, out and later lists, and is that signature
    recorded with a date? If scope is disputed later, whose signature ends the argument?
  why: >-
    The scope was agreed with a delegate. The real business owner saw it for the first time at user
    acceptance and rejected half of the out-of-scope list.
  applies: {kind: [any], components: [any], patterns: [any]}
  owner: project-manager
  also: [business-owner, business-analyst]
  evidence:
    docs: [decisions, discovery]
    looks_like: >-
      A dated sign-off record naming the business owner, the version of the scope signed, and any conditions.
  signals:
    - The scope document has no approver, approval date or version.
    - Approval is recorded as "agreed in meeting" without a name.
    - The approver is not the business owner named in the stakeholder map.
  contradiction: >-
    Compare the scope sign-off with the stakeholder map: if the person who signed is not the one the map
    names as the decision owner, the sign-off may not hold.
  due: {plan: 4, evidenced: 4}
  fail_fast: >-
    Send the out-of-scope list to the business owner today and ask for a written yes.
  severity: medium
  related: [SCOPE-01, STK-05]
  signal_id: null
